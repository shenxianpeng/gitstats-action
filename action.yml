name: 'GitStats Action'
description: 'Generate insightful visual reports from Git repositories'
author: 'Xianpeng Shen'
branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  path:
    description: 'Path to the git repository'
    required: false
    default: '.'
  output:
    description: 'Output directory for the generated statistics report'
    required: false
    default: 'gitstats-report'
  commit-start:
    description: 'Start of commit range (e.g. 10 for last 10 commits). Passed as -c commit_begin=...'
    required: false
    default: ''
  commit-end:
    description: 'End of commit range (default: HEAD). Passed as -c commit_end=...'
    required: false
    default: ''
  start-date:
    description: 'Starting date for commits (YYYY-MM-DD). Passed as -c start_date=...'
    required: false
    default: ''
  end-date:
    description: 'Ending date for commits (YYYY-MM-DD). Passed as -c end_date=...'
    required: false
    default: ''
  project-name:
    description: 'Project name to display (default: repo directory name). Passed as -c project_name=...'
    required: false
    default: ''
  config:
    description: 'Additional gitstats config overrides (pipe-separated key=value), e.g. "max_authors=10|exclude_exts=png,jpg"'
    required: false
    default: ''
  ai-enabled:
    description: 'Enable AI-powered summaries in reports'
    required: false
    default: 'false'
  ai-provider:
    description: 'AI provider: openai, claude, gemini, ollama'
    required: false
    default: ''
  ai-model:
    description: 'AI model (e.g., gpt-4o, claude-sonnet-4-20250514)'
    required: false
    default: ''
  deploy-to-pages:
    description: 'Automatically deploy the report to GitHub Pages'
    required: false
    default: 'false'
  deploy-branch:
    description: 'Branch to deploy to (only used when deploy-to-pages is true)'
    required: false
    default: 'gh-pages'

outputs:
  report_path:
    description: 'Path to the generated report'
    value: ${{ steps.gitstats.outputs.report_path }}
  pages_url:
    description: 'URL of the deployed GitHub Pages site (only set when deploy-to-pages is true)'
    value: ${{ steps.deploy.outputs.pages_url }}

runs:
  using: 'composite'
  steps:
    - name: Install GitStats
      shell: bash
      run: |
        if ! command -v gitstats &>/dev/null; then
          pip install gitstats
        fi

    - name: Run GitStats
      id: gitstats
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_COMMIT_START: ${{ inputs.commit-start }}
        INPUT_COMMIT_END: ${{ inputs.commit-end }}
        INPUT_START_DATE: ${{ inputs.start-date }}
        INPUT_END_DATE: ${{ inputs.end-date }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_AI_ENABLED: ${{ inputs.ai-enabled }}
        INPUT_AI_PROVIDER: ${{ inputs.ai-provider }}
        INPUT_AI_MODEL: ${{ inputs.ai-model }}
      run: |
        set -e

        REPO_PATH="${INPUT_PATH:-.}"
        OUTPUT_DIR="${INPUT_OUTPUT:-gitstats-report}"

        # Build config overrides as a bash array to protect values with spaces
        GT_OPTS=()

        if [ -n "${INPUT_COMMIT_START}" ]; then
          GT_OPTS+=(-c "commit_begin=${INPUT_COMMIT_START}")
        fi
        if [ -n "${INPUT_COMMIT_END}" ]; then
          GT_OPTS+=(-c "commit_end=${INPUT_COMMIT_END}")
        fi
        if [ -n "${INPUT_START_DATE}" ]; then
          GT_OPTS+=(-c "start_date=${INPUT_START_DATE}")
        fi
        if [ -n "${INPUT_END_DATE}" ]; then
          GT_OPTS+=(-c "end_date=${INPUT_END_DATE}")
        fi
        if [ -n "${INPUT_PROJECT_NAME}" ]; then
          GT_OPTS+=(-c "project_name=${INPUT_PROJECT_NAME}")
        fi

        # Additional config overrides (pipe-separated key=value pairs)
        if [ -n "${INPUT_CONFIG}" ]; then
          IFS='|' read -ra PAIRS <<< "${INPUT_CONFIG}"
          for pair in "${PAIRS[@]}"; do
            pair=$(echo "$pair" | xargs)  # trim whitespace
            [ -n "$pair" ] && GT_OPTS+=(-c "$pair")
          done
        fi

        # AI options
        if [ "${INPUT_AI_ENABLED}" = "true" ]; then
          GT_OPTS+=(--ai)
        fi
        if [ -n "${INPUT_AI_PROVIDER}" ]; then
          GT_OPTS+=(--ai-provider "${INPUT_AI_PROVIDER}")
        fi
        if [ -n "${INPUT_AI_MODEL}" ]; then
          GT_OPTS+=(--ai-model "${INPUT_AI_MODEL}")
        fi

        echo "Repository: $REPO_PATH"
        echo "Output dir: $OUTPUT_DIR"
        echo "Options: ${GT_OPTS[*]}"

        gitstats "${GT_OPTS[@]}" "$REPO_PATH" "$OUTPUT_DIR"

        echo ""
        echo "📊 GitStats report generated successfully!"
        echo "::notice title=GitStats Report::Open $OUTPUT_DIR/index.html to view the report."

        echo "report_path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy-to-pages == 'true' }}
      id: deploy
      shell: bash
      env:
        REPORT_PATH: ${{ steps.gitstats.outputs.report_path }}
        DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
      run: |
        set -e
        cd "${REPORT_PATH}"

        echo "🚀 Deploying to branch '${DEPLOY_BRANCH}'..."

        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Deploy gitstats report [skip ci]"
        git push --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:${DEPLOY_BRANCH}"

        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
        echo "✅ Report deployed to ${DEPLOY_BRANCH}"
        echo "🌐 Pages URL: ${PAGES_URL}"
        echo "pages_url=${PAGES_URL}" >> "${GITHUB_OUTPUT}"
