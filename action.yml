name: 'GitStats Action'
description: 'Generate insightful visual reports from Git repositories'
author: 'Xianpeng Shen'
branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  path:
    description: 'Path to the git repository'
    required: false
    default: '.'
  output:
    description: 'Output directory for the generated statistics report'
    required: false
    default: 'gitstats-report'
  config:
    description: >
      GitStats config overrides (pipe-separated key=value pairs).
      All gitstats options are supported, e.g.:
      "project_name=My Project|max_authors=10|exclude_exts=png,jpg"
    required: false
    default: ''
  ai-enabled:
    description: 'Enable AI-powered summaries in reports'
    required: false
    default: 'false'
  ai-provider:
    description: 'AI provider: openai, claude, gemini, ollama'
    required: false
    default: ''
  ai-model:
    description: 'AI model (e.g., gpt-4o, claude-sonnet-4-20250514)'
    required: false
    default: ''
  deploy-to-pages:
    description: 'Automatically deploy the report to GitHub Pages'
    required: false
    default: 'false'
  deploy-branch:
    description: 'Branch to deploy to (only used when deploy-to-pages is true)'
    required: false
    default: 'gh-pages'
  github-token:
    description: 'Token used to push the report to the deploy branch (only used when deploy-to-pages is true)'
    required: false
    default: ${{ github.token }}

outputs:
  report_path:
    description: 'Path to the generated report'
    value: ${{ steps.gitstats.outputs.report_path }}
  pages_url:
    description: 'URL of the deployed GitHub Pages site (only set when deploy-to-pages is true)'
    value: ${{ steps.deploy.outputs.pages_url }}
  badge_url:
    description: 'URL of the deployed badge.svg (only set when deploy-to-pages is true)'
    value: ${{ steps.deploy.outputs.badge_url }}
  badge_markdown:
    description: 'Ready-to-copy README badge markdown linking to the report (only set when deploy-to-pages is true)'
    value: ${{ steps.deploy.outputs.badge_markdown }}

runs:
  using: 'composite'
  steps:
    - name: Install GitStats
      shell: bash
      run: |
        if ! command -v gitstats &>/dev/null; then
          pip install gitstats
        fi

    - name: Run GitStats
      id: gitstats
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_AI_ENABLED: ${{ inputs.ai-enabled }}
        INPUT_AI_PROVIDER: ${{ inputs.ai-provider }}
        INPUT_AI_MODEL: ${{ inputs.ai-model }}
      run: |
        set -e

        REPO_PATH="${{ inputs.path }}"
        OUTPUT_DIR="${{ inputs.output }}"

        # Build config overrides as a bash array to protect values with spaces
        GT_OPTS=()

        # Parse pipe-separated config overrides
        if [ -n "${INPUT_CONFIG}" ]; then
          IFS='|' read -ra PAIRS <<< "${INPUT_CONFIG}"
          for pair in "${PAIRS[@]}"; do
            pair=$(echo "$pair" | xargs)  # trim whitespace
            [ -n "$pair" ] && GT_OPTS+=(-c "$pair")
          done
        fi

        # AI options
        if [ "${INPUT_AI_ENABLED}" = "true" ]; then
          GT_OPTS+=(--ai)
        fi
        if [ -n "${INPUT_AI_PROVIDER}" ]; then
          GT_OPTS+=(--ai-provider "${INPUT_AI_PROVIDER}")
        fi
        if [ -n "${INPUT_AI_MODEL}" ]; then
          GT_OPTS+=(--ai-model "${INPUT_AI_MODEL}")
        fi

        echo "Repository: $REPO_PATH"
        echo "Output dir: $OUTPUT_DIR"
        echo "Options: ${GT_OPTS[*]}"

        gitstats "${GT_OPTS[@]}" "$REPO_PATH" "$OUTPUT_DIR"

        echo ""
        echo "📊 GitStats report generated successfully!"
        echo "::notice title=GitStats Report::Open $OUTPUT_DIR/index.html to view the report."

        echo "report_path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy-to-pages == 'true' }}
      id: deploy
      shell: bash
      env:
        REPORT_PATH: ${{ steps.gitstats.outputs.report_path }}
        DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        cd "${REPORT_PATH}"

        echo "🚀 Deploying to branch '${DEPLOY_BRANCH}'..."

        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Deploy gitstats report [skip ci]"
        git push --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:${DEPLOY_BRANCH}"

        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
        BADGE_URL="${PAGES_URL}/badge.svg"
        BADGE_MARKDOWN="[![GitStats](${BADGE_URL})](${PAGES_URL}/)"
        echo "✅ Report deployed to ${DEPLOY_BRANCH}"
        echo "🌐 Pages URL: ${PAGES_URL}"
        echo "pages_url=${PAGES_URL}" >> "${GITHUB_OUTPUT}"
        echo "badge_url=${BADGE_URL}" >> "${GITHUB_OUTPUT}"
        echo "badge_markdown=${BADGE_MARKDOWN}" >> "${GITHUB_OUTPUT}"

        {
          echo "## 📊 GitStats report deployed"
          echo ""
          echo "🌐 **Report:** ${PAGES_URL}/"
          echo ""
          echo "Share it — add this badge to your README:"
          echo ""
          echo '```markdown'
          echo "${BADGE_MARKDOWN}"
          echo '```'
          echo ""
          echo "Preview: ${BADGE_MARKDOWN}"
          echo ""
          echo "> The badge shows the repository's live commit count and updates automatically on every deploy."
          echo ">"
          echo "> Prefer a different metric? Swap \`badge.svg\` for \`badges/<metric>.svg\` — available metrics: \`commits\`, \`last-commit\`, \`authors\`, \`files\`, \`lines\`. Colors, label, and shape are configurable via the \`config\` input (e.g. \`config: badge_color=green|badge_style=flat-square\`)."
        } >> "${GITHUB_STEP_SUMMARY}"
